<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keşfet — achilldemica</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3EXCPRQ70F"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-3EXCPRQ70F')</script>
<style>
:root { --bg:#faf7f2; --text:#4a3f32; --heading:#2c2416; --accent:#c4956a; --border:#e0d5c5; }
*{box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);line-height:1.7;margin:0}
.tab-nav{font-family:-apple-system,sans-serif;display:flex;gap:0;max-width:1100px;margin:0 auto;padding:16px 20px 0;border-bottom:2px solid var(--border)}
.tab-link{padding:10px 24px;text-decoration:none;font-size:14px;font-weight:600;color:var(--accent);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s}
.tab-link:hover{color:var(--heading);border-bottom-color:var(--accent)}
.tab-link.active{color:var(--heading);border-bottom-color:var(--heading)}
.container{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:1.8em;color:var(--heading);margin-bottom:0.2em;text-align:center}
.subtitle{text-align:center;color:var(--accent);font-size:14px;font-family:-apple-system,sans-serif;margin-bottom:24px}

/* Date nav */
.date-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:24px;font-family:-apple-system,sans-serif}
.date-nav button{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--text)}
.date-nav button:hover{background:var(--accent);color:white;border-color:var(--accent)}
.date-nav button:disabled{opacity:0.3;cursor:not-allowed}
.date-str{font-size:16px;font-weight:600;color:var(--heading);min-width:140px;text-align:center}

/* Category filters */
.categories{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;font-family:-apple-system,sans-serif}
.cat-btn{padding:5px 14px;border-radius:16px;border:1px solid var(--border);background:white;font-size:13px;cursor:pointer;transition:all 0.15s}
.cat-btn:hover,.cat-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
.cat-count{font-size:11px;opacity:0.7;margin-left:2px}

/* Article grid */
.articles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-bottom:40px}
.article-card{background:white;border:1px solid var(--border);border-radius:10px;padding:20px;position:relative;transition:box-shadow 0.2s}
.article-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.card-journal{font-family:-apple-system,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent);font-weight:600;margin-bottom:6px}
.card-category{position:absolute;top:16px;right:16px;font-size:11px;font-family:-apple-system,sans-serif;font-weight:600;padding:2px 8px;border-radius:4px}
.card-category[data-cat="Paradigma Kırıcı"]{color:#dc2626;background:#fef2f2}
.card-category[data-cat="Yeni Çerçeve"]{color:#2563eb;background:#eff6ff}
.card-category[data-cat="Disiplinler Arası"]{color:#7c3aed;background:#f5f3ff}
.card-category[data-cat="Metodolojik İnovasyon"]{color:#059669;background:#ecfdf5}
.card-category[data-cat="Beklenmedik Bulgu"]{color:#d97706;background:#fffbeb}
.card-title{font-size:16px;font-weight:bold;color:var(--heading);line-height:1.3;margin-bottom:6px;padding-right:100px}
.card-authors{font-size:13px;color:#999;font-family:-apple-system,sans-serif;margin-bottom:10px}
.card-summary{font-size:14px;line-height:1.6;margin-bottom:12px}
.card-why{background:#fffbeb;border-left:3px solid #f59e0b;padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:14px;font-size:13px;line-height:1.5}
.card-why strong{color:#b45309;display:block;margin-bottom:4px;font-size:12px}
.card-actions{display:flex;gap:8px;font-family:-apple-system,sans-serif}
.card-actions a{padding:5px 12px;border-radius:6px;font-size:13px;text-decoration:none;border:1px solid var(--border);color:var(--text)}
.card-actions a:hover{background:var(--accent);color:white;border-color:var(--accent)}

.empty{text-align:center;padding:60px 20px;color:#999;font-style:italic}
.loading{text-align:center;padding:40px;color:var(--accent)}

footer{text-align:center;padding:30px;font-family:-apple-system,sans-serif;font-size:13px;color:#999;border-top:1px solid var(--border);margin-top:40px}

@media(max-width:600px){
  .articles{grid-template-columns:1fr}
  .card-title{padding-right:80px;font-size:15px}
  nav{padding:12px 16px}
  .container{padding:12px}
}
</style>
</head>
<body>

<nav class="tab-nav">
  <a href="/" class="tab-link">Yazılarım</a>
  <a href="/kesket.html" class="tab-link active">Tıbbi Makale Keşfeti</a>
  <a href="/yaz.html" class="tab-link">Yaz</a>
</nav>

<div class="container" style="padding-top:40px">
  <p class="subtitle">Günün dikkat çekici tıp ve bilim makaleleri</p>

  <div class="date-nav">
    <button id="prev-btn" onclick="changeDate(-1)">◀</button>
    <span class="date-str" id="date-display"></span>
    <button id="next-btn" onclick="changeDate(1)">▶</button>
  </div>

  <div class="categories" id="categories"></div>
  <div class="articles" id="articles"></div>
</div>

<footer>achilldemica</footer>

<script>
const BASE = 'data/discover';
let currentDate = new Date();
let articles = [];
let activeCategory = null;

// Bugüne set et
function today() { return new Date().toISOString().split('T')[0]; }

function formatDate(d) {
  const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function dateStr(d) { return d.toISOString().split('T')[0]; }

function changeDate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  // Gelecek güne gitme
  if (dateStr(currentDate) > today()) {
    currentDate.setDate(currentDate.getDate() - delta);
    return;
  }
  loadArticles();
}

async function loadArticles() {
  const ds = dateStr(currentDate);
  document.getElementById('date-display').textContent = formatDate(currentDate);
  document.getElementById('next-btn').disabled = ds >= today();

  const el = document.getElementById('articles');
  el.innerHTML = '<div class="loading">Yükleniyor...</div>';

  try {
    const res = await fetch(BASE + '/' + ds + '.json?t=' + Date.now());
    if (!res.ok) throw new Error('not found');
    articles = await res.json();
  } catch(e) {
    articles = [];
  }

  activeCategory = null;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const cats = {};
  articles.forEach(a => {
    const c = a.category || 'Diğer';
    cats[c] = (cats[c] || 0) + 1;
  });

  let html = '<button class="cat-btn' + (!activeCategory ? ' active' : '') + '" onclick="filterCat(null)">Tümü<span class="cat-count">(' + articles.length + ')</span></button>';
  Object.entries(cats).sort((a,b) => b[1]-a[1]).forEach(([cat, count]) => {
    html += '<button class="cat-btn' + (activeCategory === cat ? ' active' : '') + '" onclick="filterCat(\'' + cat.replace(/'/g,"\\'") + '\')">' + cat + '<span class="cat-count">(' + count + ')</span></button>';
  });
  document.getElementById('categories').innerHTML = html;
}

function filterCat(cat) {
  activeCategory = cat;
  renderCategories();
  renderArticles();
}

function renderArticles() {
  const filtered = activeCategory ? articles.filter(a => a.category === activeCategory) : articles;

  if (filtered.length === 0) {
    document.getElementById('articles').innerHTML = '<div class="empty">Bu tarih için makale bulunamadı.</div>';
    return;
  }

  document.getElementById('articles').innerHTML = filtered.map(a => {
    const doiUrl = a.doi ? 'https://doi.org/' + a.doi : (a.url || '#');
    return '<div class="article-card">' +
      '<div class="card-journal">' + (a.journal || '') + '</div>' +
      (a.category ? '<span class="card-category" data-cat="' + a.category + '">' + a.category + '</span>' : '') +
      '<div class="card-title">' + (a.title || '') + '</div>' +
      '<div class="card-authors">' + (a.authors || '') + '</div>' +
      '<div class="card-summary">' + (a.summary || '') + '</div>' +
      (a.why_interesting ? '<div class="card-why"><strong>NEDEN İLGİNÇ?</strong>' + a.why_interesting + '</div>' : '') +
      '<div class="card-actions">' +
        '<a href="' + doiUrl + '" target="_blank">DOI</a>' +
      '</div>' +
    '</div>';
  }).join('');
}

// Başlat
loadArticles();
</script>
</body>
</html>
