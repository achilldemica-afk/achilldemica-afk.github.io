<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>achilldemica</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3EXCPRQ70F"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-3EXCPRQ70F')</script>
<style>
:root { --bg:#faf7f2; --text:#4a3f32; --heading:#2c2416; --accent:#c4956a; --border:#e0d5c5; }
*{box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);line-height:1.8;margin:0}
.tab-nav{font-family:-apple-system,sans-serif;display:flex;align-items:flex-end;gap:0;max-width:1100px;margin:0 auto;padding:16px 20px 0;border-bottom:2px solid var(--border)}
.tab-link{padding:10px 24px;text-decoration:none;font-size:14px;font-weight:600;color:var(--accent);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s}
.tab-link:hover{color:var(--heading);border-bottom-color:var(--accent)}
.tab-link.active{color:var(--heading);border-bottom-color:var(--heading)}
.posts{max-width:680px;margin:0 auto;padding:40px 20px}
.posts h1{font-size:1.8em;color:var(--heading);margin-bottom:0.5em}
.post-card{display:block;padding:20px 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text);transition:padding-left 0.15s}
.post-card:hover{padding-left:8px}
.post-card h2{margin:4px 0;color:var(--heading);font-size:1.2em}
.post-card p{margin:4px 0 0;font-size:14px;color:#6b5e4f}
.post-date{font-family:-apple-system,sans-serif;font-size:12px;color:var(--accent)}
.post-author{font-family:-apple-system,sans-serif;font-size:12px;color:#6b5e4f;margin-left:8px}
footer{text-align:center;padding:40px 20px;font-family:-apple-system,sans-serif;font-size:13px;color:#a0937e;border-top:1px solid var(--border);max-width:680px;margin:0 auto}
#author-slot{margin-left:auto;display:flex;align-items:flex-end;padding-bottom:2px}
.am-drop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #e0d5c5;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);width:320px;z-index:1000;font-family:-apple-system,sans-serif;overflow:hidden}
@media(max-width:600px){.posts{padding:20px 16px}.posts h1{font-size:1.4em}}
</style>
</head>
<body>
<nav class="tab-nav">
  <a href="/" class="tab-link active">Yazılarımız</a>
  <a href="/kesket.html" class="tab-link">Tıbbi Makale Keşfeti</a>
  <div id="author-slot"><a href="/editor/" class="tab-link" style="margin-bottom:-2px">Yazar Girişi</a></div>
</nav>
<div class="posts">
<p style="color:#a0937e">Henüz yazı yok.</p>
</div>
<footer><p>&copy; achilldemica</p></footer>
<script>(function(){
  var W='https://achilldemica-comments.achilldemica.workers.dev';
  var tok=localStorage.getItem('blog-editor-token');
  var aut=localStorage.getItem('blog-editor-author');
  var slot=document.getElementById('author-slot');
  if(!slot)return;
  if(!tok||!aut)return;
  var open=false,tab='posts';
  slot.innerHTML='<div style="position:relative"><button id="am-btn" style="background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#2c2416;padding:6px 4px;font-family:-apple-system,sans-serif">'+aut+' ▾</button></div>';
  document.getElementById('am-btn').onclick=function(e){e.stopPropagation();open=!open;var d=document.getElementById('am-drop');if(!d){buildDrop();}else{d.style.display=open?'block':'none';}};
  document.addEventListener('click',function(){open=false;var d=document.getElementById('am-drop');if(d)d.style.display='none';});
  function buildDrop(){
    var wrap=slot.querySelector('div');
    var d=document.createElement('div');d.id='am-drop';d.className='am-drop';
    d.innerHTML='<div style="display:flex;border-bottom:1px solid #e0d5c5"><button id="am-tp" onclick="window._amTab('posts')" style="flex:1;padding:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:#faf7f2;color:#2c2416">Yazılarım</button><button id="am-tc" onclick="window._amTab('comments')" style="flex:1;padding:10px;border:none;cursor:pointer;font-size:13px;color:#888;background:#fff">Yorumlar</button></div><div id="am-body" style="max-height:300px;overflow-y:auto;padding:0"></div><div style="padding:8px;border-top:1px solid #e0d5c5"><button onclick="localStorage.removeItem('blog-editor-token');localStorage.removeItem('blog-editor-author');location.reload()" style="width:100%;padding:9px;border:1px solid #e0d5c5;background:#fff;color:#6b5e4f;border-radius:6px;cursor:pointer;font-size:13px;font-family:-apple-system,sans-serif">Çıkış Yap</button></div>';
    wrap.appendChild(d);
    window._amTab('posts');
  }
  window._amTab=function(t){
    tab=t;
    var tp=document.getElementById('am-tp'),tc=document.getElementById('am-tc');
    if(tp){tp.style.fontWeight=t==='posts'?'600':'400';tp.style.background=t==='posts'?'#faf7f2':'#fff';}
    if(tc){tc.style.fontWeight=t==='comments'?'600':'400';tc.style.background=t==='comments'?'#faf7f2':'#fff';tc.style.color=t==='comments'?'#2c2416':'#888';}
    if(t==='posts')loadPosts();else loadComments();
  };
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function loadPosts(){
    var b=document.getElementById('am-body');if(!b)return;
    b.innerHTML='<div style="padding:16px;color:#999;font-size:13px;text-align:center">Yükleniyor...</div>';
    fetch(W+'/draft/posts',{headers:{'Authorization':'Bearer '+tok}}).then(function(r){return r.json();}).then(function(d){
      var posts=d.posts||[];
      if(!posts.length){b.innerHTML='<div style="padding:16px;color:#999;font-size:13px;text-align:center">Yayınlanmış yazı yok</div>';return;}
      b.innerHTML=posts.map(function(p){
        return '<div style="padding:10px 14px;border-bottom:1px solid #f0ebe4;display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="min-width:0"><div style="font-size:13px;color:#2c2416;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.title)+'</div><div style="font-size:11px;color:#999">'+esc(p.date)+'</div></div><div style="display:flex;gap:5px;flex-shrink:0"><a href="/editor/" style="font-size:11px;padding:3px 8px;border:1px solid #c4956a;background:#fff;color:#c4956a;border-radius:4px;text-decoration:none">Düzenle</a><button onclick="window._amKaldır(''+p.slug+'')" style="font-size:11px;padding:3px 8px;border:1px solid #dc2626;background:#fff;color:#dc2626;border-radius:4px;cursor:pointer">Kaldır</button></div></div>';
      }).join('');
    }).catch(function(){b.innerHTML='<div style="padding:16px;color:#dc2626;font-size:13px;text-align:center">Yüklenemedi.</div>';});
  }
  function loadComments(){
    var b=document.getElementById('am-body');if(!b)return;
    b.innerHTML='<div style="padding:16px;color:#999;font-size:13px;text-align:center">Yükleniyor...</div>';
    fetch(W+'/draft/comments',{headers:{'Authorization':'Bearer '+tok}}).then(function(r){return r.json();}).then(function(d){
      var cs=d.comments||[];
      if(!cs.length){b.innerHTML='<div style="padding:16px;color:#999;font-size:13px;text-align:center">Bekleyen yorum yok</div>';return;}
      b.innerHTML=cs.map(function(c){
        var id='c'+Date.now()+Math.random().toString(36).slice(2);
        window['_rc_'+id]=c;
        return '<div style="padding:12px 14px;border-bottom:1px solid #f0ebe4"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><strong style="font-size:13px;color:#2c2416">'+esc(c.isim)+'</strong><span style="font-size:11px;color:#999">'+new Date(c.tarih).toLocaleDateString('tr-TR')+'</span></div><div style="font-size:11px;color:#c4956a;margin-bottom:6px">'+esc(c.yazi)+'</div><p style="margin:0 0 8px;font-size:13px;color:#4a3f32;line-height:1.5">'+esc(c.yorum)+'</p><textarea id="rp_'+id+'" placeholder="Cevap yaz..." rows="2" style="width:100%;font-size:12px;padding:6px 10px;border:1px solid #e0d5c5;border-radius:5px;resize:vertical;box-sizing:border-box;margin-bottom:8px;font-family:-apple-system,sans-serif"></textarea><div style="display:flex;gap:6px"><button onclick="window._amOnayla(''+id+'')" style="flex:1;font-size:12px;padding:5px;border:none;background:#16a34a;color:#fff;border-radius:4px;cursor:pointer">Onayla</button><button onclick="window._amRed(''+id+'')" style="flex:1;font-size:12px;padding:5px;border:1px solid #dc2626;background:#fff;color:#dc2626;border-radius:4px;cursor:pointer">Sil</button></div></div>';
      }).join('');
    }).catch(function(){b.innerHTML='<div style="padding:16px;color:#dc2626;font-size:13px;text-align:center">Yüklenemedi.</div>';});
  }
  window._amKaldır=function(slug){
    if(!confirm('Bu yazıyı yayından kaldırmak istediğinize emin misiniz?'))return;
    fetch(W+'/draft/unpublish',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({slug:slug})})
      .then(function(){loadPosts();}).catch(function(e){alert('Hata: '+e.message);});
  };
  window._amOnayla=function(id){
    var c=window['_rc_'+id];if(!c)return;
    var reply=document.getElementById('rp_'+id);
    fetch(W+'/draft/comments/approve',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({filename:c.filename,sha:c.sha,reply:reply?reply.value:''})})
      .then(function(){loadComments();}).catch(function(e){alert('Hata: '+e.message);});
  };
  window._amRed=function(id){
    var c=window['_rc_'+id];if(!c)return;
    fetch(W+'/draft/comments/reject',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({filename:c.filename,sha:c.sha})})
      .then(function(){loadComments();}).catch(function(e){alert('Hata: '+e.message);});
  };
})()</script>
</body>
</html>
