<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaz — achilldemica</title>
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<style>
:root { --bg:#faf7f2; --text:#4a3f32; --heading:#2c2416; --accent:#c4956a; --border:#e0d5c5; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Tab nav */
.tab-nav{display:flex;gap:0;max-width:1100px;margin:0 auto;padding:16px 20px 0;border-bottom:2px solid var(--border)}
.tab-link{padding:10px 24px;text-decoration:none;font-size:14px;font-weight:600;color:var(--accent);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s}
.tab-link:hover{color:var(--heading);border-bottom-color:var(--accent)}
.tab-link.active{color:var(--heading);border-bottom-color:var(--heading)}

/* Login screen */
.login-container{max-width:360px;margin:80px auto;padding:40px 24px;text-align:center}
.login-container h1{font-family:Georgia,serif;font-size:1.8em;color:var(--heading);margin-bottom:8px;font-style:italic}
.login-container p{color:#6b5e4f;font-size:14px;margin-bottom:32px}
.login-form{display:flex;flex-direction:column;gap:12px}
.login-form input{padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:white;color:var(--text);outline:none;transition:border-color 0.15s}
.login-form input:focus{border-color:var(--accent)}
.login-form button{padding:12px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s}
.login-form button:hover{background:#b07e52}
.login-form button:disabled{opacity:0.6;cursor:not-allowed}
.login-error{color:#c0392b;font-size:13px;margin-top:4px}

/* Editor screen */
.editor-container{max-width:800px;margin:0 auto;padding:24px 20px 60px;display:none}
.editor-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.editor-header .user-info{font-size:13px;color:#6b5e4f}
.editor-header .user-info strong{color:var(--heading)}
.btn-logout{font-size:12px;color:var(--accent);background:none;border:1px solid var(--border);padding:4px 12px;border-radius:4px;cursor:pointer}
.btn-logout:hover{background:#f5efe6}

.field-group{margin-bottom:16px}
.field-group label{display:block;font-size:13px;font-weight:600;color:var(--heading);margin-bottom:6px}
.field-group input, .field-group select, .field-group textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:white;color:var(--text);outline:none}
.field-group input:focus, .field-group textarea:focus{border-color:var(--accent)}
.field-row{display:flex;gap:12px}
.field-row .field-group{flex:1}

#editor-area{height:400px;background:white;border-radius:0 0 6px 6px;font-family:Georgia,serif;font-size:16px;line-height:1.8}
.ql-toolbar.ql-snow{border-radius:6px 6px 0 0;border-color:var(--border);background:white}
.ql-container.ql-snow{border-color:var(--border)}

.editor-actions{display:flex;gap:12px;margin-top:20px;align-items:center}
.btn-submit{padding:12px 32px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s}
.btn-submit:hover{background:#b07e52}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed}
.submit-status{font-size:13px;color:#6b5e4f;margin-left:8px}

/* Submissions list */
.my-submissions{margin-top:32px;border-top:1px solid var(--border);padding-top:24px}
.my-submissions h3{font-size:15px;color:var(--heading);margin-bottom:12px}
.sub-item{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sub-title{font-weight:600;color:var(--heading);font-size:14px}
.sub-meta{font-size:12px;color:#a0937e}
.sub-status{font-size:12px;padding:2px 8px;border-radius:4px;font-weight:600}
.sub-status.pending{background:#fef3cd;color:#856404}
.sub-status.approved{background:#d4edda;color:#155724}
.sub-status.rejected{background:#f8d7da;color:#721c24}

@media(max-width:600px){
  .login-container{margin:40px 16px;padding:24px 16px}
  .editor-container{padding:16px}
  .field-row{flex-direction:column}
  #editor-area{height:300px}
}
</style>
</head>
<body>

<nav class="tab-nav">
  <a href="/" class="tab-link">Yazılarım</a>
  <a href="/kesket.html" class="tab-link">Tıbbi Makale Keşfeti</a>
  <a href="/yaz.html" class="tab-link active">Yazar Girişi</a>
</nav>

<!-- Login Screen -->
<div class="login-container" id="login-screen">
  <h1>achilldemica</h1>
  <p>Yazar girişi</p>
  <form class="login-form" id="login-form">
    <input type="text" id="login-username" placeholder="Kullanıcı adı" required autocomplete="username">
    <input type="password" id="login-password" placeholder="Şifre" required autocomplete="current-password">
    <button type="submit" id="login-btn">Giriş Yap</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<!-- Editor Screen -->
<div class="editor-container" id="editor-screen">
  <div class="editor-header">
    <div class="user-info">Merhaba, <strong id="user-display-name"></strong></div>
    <button class="btn-logout" id="btn-logout">Çıkış</button>
  </div>

  <div class="field-group">
    <label>Başlık</label>
    <input type="text" id="post-title" placeholder="Yazınızın başlığı">
  </div>

  <div class="field-row">
    <div class="field-group">
      <label>Dil</label>
      <select id="post-lang">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="field-group">
      <label>Kısa Açıklama</label>
      <input type="text" id="post-description" placeholder="Bir-iki cümlelik özet">
    </div>
  </div>

  <div class="field-group">
    <label>İçerik</label>
    <div id="editor-area"></div>
  </div>

  <div class="editor-actions">
    <button class="btn-submit" id="btn-submit">Yazıyı Gönder</button>
    <span class="submit-status" id="submit-status"></span>
  </div>

  <div class="my-submissions" id="my-submissions">
    <h3>Gönderilerim</h3>
    <div id="submissions-list"></div>
  </div>
</div>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
const API = 'https://achilldemica-comments.achilldemica.workers.dev';
let quill;
let authToken = localStorage.getItem('achilldemica_token');
let currentUser = null;

// Init Quill
function initEditor() {
  if (quill) return;
  quill = new Quill('#editor-area', {
    theme: 'snow',
    placeholder: 'Yazınızı buraya yazın...',
    modules: {
      toolbar: [
        [{ header: [2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        ['blockquote'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link', 'image'],
        ['clean']
      ]
    }
  });
}

// Show/hide screens
function showLogin() {
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('editor-screen').style.display = 'none';
}

function showEditor() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('editor-screen').style.display = 'block';
  document.getElementById('user-display-name').textContent = currentUser.displayName;
  initEditor();
  loadMySubmissions();
}

// Verify existing session
async function verifySession() {
  if (!authToken) { showLogin(); return; }
  try {
    const res = await fetch(`${API}/auth/verify`, {
      headers: { 'Authorization': `Bearer ${authToken}` }
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    currentUser = data.user;
    showEditor();
  } catch {
    localStorage.removeItem('achilldemica_token');
    authToken = null;
    showLogin();
  }
}

// Login
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Giriş yapılıyor...';
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.error; return; }
    authToken = data.token;
    currentUser = data.user;
    localStorage.setItem('achilldemica_token', authToken);
    showEditor();
  } catch (err) {
    errorEl.textContent = 'Bağlantı hatası.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Giriş Yap';
  }
});

// Logout
document.getElementById('btn-logout').addEventListener('click', () => {
  localStorage.removeItem('achilldemica_token');
  authToken = null;
  currentUser = null;
  showLogin();
});

// Submit article
document.getElementById('btn-submit').addEventListener('click', async () => {
  const title = document.getElementById('post-title').value.trim();
  const lang = document.getElementById('post-lang').value;
  const description = document.getElementById('post-description').value.trim();
  const content = quill.root.innerHTML;
  const statusEl = document.getElementById('submit-status');
  const btn = document.getElementById('btn-submit');

  if (!title) { statusEl.textContent = 'Başlık gerekli.'; return; }
  if (!content || content === '<p><br></p>') { statusEl.textContent = 'İçerik boş olamaz.'; return; }

  btn.disabled = true;
  statusEl.textContent = 'Gönderiliyor...';

  try {
    const res = await fetch(`${API}/submissions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}`
      },
      body: JSON.stringify({ title, content, lang, description })
    });
    const data = await res.json();
    if (!res.ok) { statusEl.textContent = data.error; return; }
    statusEl.textContent = 'Yazınız gönderildi! Onay bekleniyor.';
    // Clear form
    document.getElementById('post-title').value = '';
    document.getElementById('post-description').value = '';
    quill.setContents([]);
    loadMySubmissions();
  } catch (err) {
    statusEl.textContent = 'Gönderim hatası.';
  } finally {
    btn.disabled = false;
  }
});

// Load my submissions
async function loadMySubmissions() {
  try {
    const res = await fetch(`${API}/my-submissions`, {
      headers: { 'Authorization': `Bearer ${authToken}` }
    });
    const data = await res.json();
    const list = document.getElementById('submissions-list');
    if (!data.submissions || data.submissions.length === 0) {
      list.innerHTML = '<p style="color:#a0937e;font-size:13px">Henüz gönderiniz yok.</p>';
      return;
    }
    list.innerHTML = data.submissions.map(s => `
      <div class="sub-item">
        <div>
          <div class="sub-title">${s.title}</div>
          <div class="sub-meta">${new Date(s.submittedAt).toLocaleDateString('tr-TR')}</div>
        </div>
        <span class="sub-status ${s.status}">${
          s.status === 'pending' ? 'Onay Bekliyor' :
          s.status === 'approved' ? 'Yayınlandı' : 'Reddedildi'
        }</span>
      </div>
    `).join('');
  } catch { /* ignore */ }
}

// Init
verifySession();
</script>
</body>
</html>
